<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de pessoa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.css">
    <style>
        body {
            background: #f5f5f5;
            padding: 30px;
        }
        .container-box {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container-box">
        <h2 class="ui header">
            Cadastro de pessoa
        </h2>
        <button class="ui blue button" onclick="abrirModal()">
            Ver Cadastros
        </button>
        <button class="ui red button" onclick="limparFormulario()">
            Limpar
        </button>
        <form class="ui form" id="formPessoa">
            <input type="hidden" id="id">
            <div class="two fields">
                <div class="field">
                    <label>Nome/Razão Social</label>
                    <input type="text" id="nome_razao_social" required>
                </div>
                <div class="field">
                    <label>Nome Fantasia</label>
                    <input type="text" id="nome_social_fantasia">
                </div>
            </div>
            <div class="two fields">
                <div class="field">
                    <label>Documento</label>
                    <input type="text" id="documento" required>
                </div>
                <div class="field">
                    <label>Email</label>
                    <input type="email" id="email">
                </div>
            </div>
            <div class="three fields">
                <div class="field">
                    <label>CEP</label>
                    <input type="text" id="cep">
                </div>
                <div class="field">
                    <label>Endereço</label>
                    <input type="text" id="endereco">
                </div>
                <div class="field">
                    <label>Número</label>
                    <input type="text" id="numero">
                </div>
            </div>
            <div class="three fields">
                <div class="field">
                    <label>Bairro</label>
                    <input type="text" id="bairro">
                </div>
                <div class="field">
                    <label>Cidade</label>
                    <input type="text" id="cidade">
                </div>
                <div class="field">
                    <label>Estado</label>
                    <input type="text" id="estado">
                </div>
            </div>
            <button class="ui green button" type="submit">
                Salvar
            </button>
        </form>
    </div>
    <!-- Modal -->
    <div class="ui modal" id="modalLista">
        <div class="header">pessoa Cadastradas</div>
        <div class="content">
            <table class="ui celled table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Documento</th>
                        <th>Email</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelapessoa"></tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.js"></script>
    <script>
        const API = "http://localhost:3000/pessoa";

        // SALVAR OU EDITAR
        document.getElementById("formPessoa").addEventListener("submit", async function (e) {
            e.preventDefault();
            const id = document.getElementById("id").value;
            const documento = document.getElementById("documento").value.replace(/\D/g, '');
            const payload = {
                nome_razao_social: document.getElementById("nome_razao_social").value,
                nome_social_fantasia: document.getElementById("nome_social_fantasia").value,
                documento: documento,
                tipo: documento.length > 11 ? "CNPJ" : "CPF",
                email: document.getElementById("email").value,
                cep: document.getElementById("cep").value.replace(/\D/g, ''),
                endereco: document.getElementById("endereco").value,
                numero: document.getElementById("numero").value,
                bairro: document.getElementById("bairro").value,
                cidade: document.getElementById("cidade").value,
                estado: document.getElementById("estado").value,
                pais: "Brasil"
            };
            try {
                let res;

                if (id) {
                    res = await fetch(`${API}/${id}`, {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(payload)
                    });
                } else {
                    res = await fetch(API, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(payload)
                    });
                }
                if (res.ok) {
                    alert("Salvo com sucesso");
                    limparFormulario();
                    carregarpessoa();
                } else {
                    alert("Erro ao salvar");
                }
            } catch (err) {
                alert("Erro no servidor");
            }
        });
        // LISTAR
        async function carregarpessoa() {
            const res = await fetch(API);
            const dados = await res.json();
            const tabela = document.getElementById("tabelapessoa");
            tabela.innerHTML = "";
            dados.forEach(pessoa => {
                tabela.innerHTML += `
            <tr>
                <td>${pessoa.id}</td>
                <td>${pessoa.nome_razao_social}</td>
                <td>${pessoa.documento}</td>
                <td>${pessoa.email || '-'}</td>
                <td>
                    <button class="ui yellow button"
                        onclick="editarPessoa(${pessoa.id})">
                        Editar
                    </button>
                    <button class="ui red button"
                        onclick="deletarPessoa(${pessoa.id})">
                        Excluir
                    </button>
                </td>
            </tr>
        `;
            });
        }
        // EDITAR
        async function editarPessoa(id) {
            const res = await fetch(API);
            const dados = await res.json();
            const pessoa = dados.find(p => p.id === id);
            if (!pessoa) return;
            document.getElementById("id").value = pessoa.id;
            document.getElementById("nome_razao_social").value = pessoa.nome_razao_social;
            document.getElementById("nome_social_fantasia").value = pessoa.nome_social_fantasia || "";
            document.getElementById("documento").value = pessoa.documento;
            document.getElementById("email").value = pessoa.email || "";
            document.getElementById("cep").value = pessoa.cep || "";
            document.getElementById("endereco").value = pessoa.endereco || "";
            document.getElementById("numero").value = pessoa.numero || "";
            document.getElementById("bairro").value = pessoa.bairro || "";
            document.getElementById("cidade").value = pessoa.cidade || "";
            document.getElementById("estado").value = pessoa.estado || "";
            $('#modalLista').modal('hide');
        }
        // EXCLUIR
        async function deletarPessoa(id) {
            if (!confirm("Deseja excluir?")) return;
            const res = await fetch(`${API}/${id}`, {
                method: "DELETE"
            });
            if (res.ok) {
                carregarpessoa();
            }
        }
        // MODAL
        function abrirModal() {
            carregarpessoa();
            $('#modalLista').modal('show');
        }
        // LIMPAR
        function limparFormulario() {
            document.getElementById("formPessoa").reset();
            document.getElementById("id").value = "";
        }
    </script>
</body>
</html>
