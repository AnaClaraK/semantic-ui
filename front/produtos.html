<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
   
    <title>Cadastro de Produtos</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --accent-color: #f43f5e;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        body {
            background: var(--bg-gradient);
            font-family: 'Plus Jakarta Sans', sans-serif !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .main-container {
            max-width: 850px;
            margin: auto;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            border: 2px solid var(--primary-color); /* ajuste de cor da borda */
            box-shadow: 10px 10px 0px #000;
        }

        .ui.button.custom-primary {
            background-color: var(--primary-color) !important;
            color: white !important;
            border-radius: 12px !important;
            transition: transform 0.2s ease;
            border: 2px solid #000 !important;
        }

        .ui.button.custom-primary:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px #000;
        }

        .ui.form input:not([type="submit"]):not([type="hidden"]) {
            border: 2px solid #333 !important;
            border-radius: 10px !important;
            padding: 12px !important;
        }

        .ui.form input:focus {
            border-color: var(--primary-color) !important;
            background: #f8fafc !important;
        }

        .ui.header { font-weight: 700 !important; letter-spacing: -1px; }

        .ui.table { border: 2px solid #000 !important; border-radius: 15px !important; overflow: hidden; }

        /* FIX: ícone do email alinhado */
        .ui.left.icon.input i.icon {
            display: flex;
            align-items: center;
            height: 100%;
        }

        /* FIX: remove aparência de "or" redondo */
        .ui.buttons .or {
            background: transparent;
            border: none;
            font-weight: 600;
            color: #666;
            margin: 0 10px;
            position: static;
            box-shadow: none;
        }
            /* FIX EMAIL ICON ALIGNMENT */
        .ui.left.icon.input i.icon {
            display: flex;
            align-items: center;
            height: 100%;
            top: 0;
            transform: translateY(0);
        }

        .ui.left.icon.input input {
            padding-left: 2.6em !important;
        }
</style>
</head>
<body>

<div class="ui container main-container">
    <div class="ui grid middle aligned">
        <div class="column">
            <h1 class="ui header">
                <span style="color: var(--primary-color)">#</span> Registro de Produtos
                <div class="sub header">Preencha os produtos.</div>
            </h1>
        </div>
    </div>
   
    <div class="ui divider" style="border-top: 2px solid #000; opacity: 0.1;"></div>

    <div class="ui buttons" style="margin-bottom: 25px; display:flex; align-items:center; gap:10px;">
        <button class="ui custom-primary button" onclick="abrirModal()">
            <i class="search icon"></i> Explorar Produtos
        </button>
        <button class="ui black button" style="border-radius: 12px; border: 2px solid #000;" onclick="limparFormulario()">
            Limpar Campos
        </button>
    </div>

    <form class="ui form" id="formProdutos">
    
        <div class="field">
            <label>Nome Produto</label>
            <input type="text" id="nomeproduto" placeholder="digite o nome do produto">
        </div>
        <div class="field">
            <label>Descrição do Produto</label>
            <input type="text" id="descricao" placeholder="descreva o produto">
        </div>
        <div class="field">
            <label>Categoria</label>
            <input type="text" id="categoria" placeholder=" categoria do produto">
        </div>

        <div class="two fields">
            <div class="field">
                <label>Preço do Produto</label>
                <input type="number" id="preco" placeholder="Preço">
            </div>
            <div class="field">
                <label>Estoque</label>
                <input type="number" id="estoque">
            </div>
        </div>
        

        <button type="submit" class="ui fluid massive custom-primary button" style="margin-top: 20px;">
            Concluir e Salvar
        </button>
    </form>
</div>

<div class="ui modal" id="modalPesquisa" style="border: 3px solid #000; border-radius: 20px;">
    <div class="header" style="background: #000; color: #fff;">Registros Atuais</div>
    <div class="content">
        <table class="ui very basic selectable table">
            <thead>
                <tr>
                    <th>Nome Produto</th>
                    <th>Preço</th>
                    <th class="right aligned">Estoque</th>
                </tr>
            </thead>
            <tbody id="tabelaProdutos"></tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.js"></script>

<script>
    const API_URL = 'http://localhost:3000/produtos';
   

    // Pegando elementos do HTML
    const form = document.getElementById('formProdutos');
    const tabela = document.getElementById('tabelaProdutos');

    // ================= CADASTRAR PRODUTO =================
    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Pegando valores dos inputs
        const payload = {
            nomeProduto: document.getElementById('nomeproduto').value,
            descricao: document.getElementById('descricao').value,
            categoria: document.getElementById('categoria').value,
            preco: Number(document.getElementById('preco').value),
            estoque: Number(document.getElementById('estoque').value)
        };

        try {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert("Produto cadastrado!");
                limparFormulario();
                carregarProdutos(); // atualiza tabela
            } else {
                alert("Erro ao cadastrar produto");
            }
        } catch (err) {
            alert("Erro de conexão com o servidor");
        }
    });


    // ================= LISTAR PRODUTOS =================
    async function carregarProdutos() {
        try {
            const res = await fetch(API_URL);
            const produtos = await res.json();

            tabela.innerHTML = "";

            produtos.forEach(p => {
                tabela.innerHTML += `
                    <tr>
                        <td>${p.nomeProduto}</td>
                        <td>R$ ${p.preco}</td>
                        <td class="right aligned">${p.estoque}</td>
                    </tr>
                `;
            });

        } catch (err) {
            console.log("Erro ao carregar produtos");
        }
    }


    // ================= LIMPAR FORM =================
    function limparFormulario() {
        form.reset();
    }


    // ================= ABRIR MODAL =================
    function abrirModal() {
        $('.ui.modal').modal('show');
        carregarProdutos(); // carrega ao abrir
    }
</script>

</body>
</html>
