<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
   
    <title>Cadastro Autêntico</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --accent-color: #f43f5e;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        body {
            background: var(--bg-gradient);
            font-family: 'Plus Jakarta Sans', sans-serif !important;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .main-container {
            max-width: 850px;
            margin: auto;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            border: 2px solid var(--primary-color); /* ajuste de cor da borda */
            box-shadow: 10px 10px 0px #000;
        }

        .ui.button.custom-primary {
            background-color: var(--primary-color) !important;
            color: white !important;
            border-radius: 12px !important;
            transition: transform 0.2s ease;
            border: 2px solid #000 !important;
        }

        .ui.button.custom-primary:hover {
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px #000;
        }

        .ui.form input:not([type="submit"]):not([type="hidden"]) {
            border: 2px solid #333 !important;
            border-radius: 10px !important;
            padding: 12px !important;
        }

        .ui.form input:focus {
            border-color: var(--primary-color) !important;
            background: #f8fafc !important;
        }

        .ui.header { font-weight: 700 !important; letter-spacing: -1px; }

        .ui.table { border: 2px solid #000 !important; border-radius: 15px !important; overflow: hidden; }

        /* FIX: ícone do email alinhado */
        .ui.left.icon.input i.icon {
            display: flex;
            align-items: center;
            height: 100%;
        }

        /* FIX: remove aparência de "or" redondo */
        .ui.buttons .or {
            background: transparent;
            border: none;
            font-weight: 600;
            color: #666;
            margin: 0 10px;
            position: static;
            box-shadow: none;
        }
            /* FIX EMAIL ICON ALIGNMENT */
        .ui.left.icon.input i.icon {
            display: flex;
            align-items: center;
            height: 100%;
            top: 0;
            transform: translateY(0);
        }

        .ui.left.icon.input input {
            padding-left: 2.6em !important;
        }
</style>
</head>
<body>

<div class="ui container main-container">
    <div class="ui grid middle aligned">
        <div class="column">
            <h1 class="ui header">
                <span style="color: var(--primary-color)">#</span> Registro de Usuário
                <div class="sub header">Preencha os dados de forma rápida e segura.</div>
            </h1>
        </div>
    </div>
   
    <div class="ui divider" style="border-top: 2px solid #000; opacity: 0.1;"></div>

    <div class="ui buttons" style="margin-bottom: 25px; display:flex; align-items:center; gap:10px;">
        <button class="ui custom-primary button" onclick="abrirModal()">
            <i class="search icon"></i> Explorar Cadastros
        </button>
        <button class="ui black button" style="border-radius: 12px; border: 2px solid #000;" onclick="limparFormulario()">
            Limpar Campos
        </button>
    </div>

    <form class="ui form" id="formPessoa">
        <div class="two fields">
            <div class="field">
                <label>Documento Principal</label>
                <input type="text" id="documento" placeholder="CPF ou CNPJ">
            </div>
            <div class="field">
                <label>Nome Completo / Razão</label>
                <input type="text" id="nome_razao_social">
            </div>
            <div class="field">
                <label>Nome Social / Fantasia</label>
                <input type="text" id="nome_social_fantasia">
            </div>
        </div>

        <div class="field">
            <label>E-mail Corporativo</label>
            <div class="ui left icon input">
                <i class="envelope icon" style="color: var(--primary-color)"></i>
                <input type="email" id="email" placeholder="nome@empresa.com">
            </div>
        </div>

        <div class="ui segment" style="background: #f1f5f9; border: none; border-radius: 15px;">
             <h4 class="ui dividing header">Localização</h4>
             <div style="display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 15px;">
                <div class="field"><label>CEP</label><input type="text" id="cep"></div>
                <div class="field"><label>Endereço</label><input type="text" id="endereco"></div>
                <div class="field"><label>Nº</label><input type="text" id="numero"></div>
             </div>
             <div class="field">
                <label>Bairro</label>
                <input type="text" id="bairro">
            </div>
           
            <div class="field">
                <label>Cidade</label>
                <input type="text" id="cidade">
            </div>
           
            <div class="field">
                <label>Estado</label>
                <input type="text" id="estado">
            </div>
        </div>

        <button type="submit" class="ui fluid massive custom-primary button" style="margin-top: 20px;">
            Concluir e Salvar
        </button>
    </form>
</div>

<div class="ui modal" id="modalPesquisa" style="border: 3px solid #000; border-radius: 20px;">
    <div class="header" style="background: #000; color: #fff;">Registros Atuais</div>
    <div class="content">
        <table class="ui very basic selectable table">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Documento</th>
                    <th class="right aligned">Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaPessoas"></tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.js"></script>

<script>
    const API_URL = 'http://localhost:3000/pessoas';
    let pessoaEditandoId = null;

    // Elementos (com proteção pra não quebrar)
    const form = document.getElementById('formPessoa');
    const inputDocumento = document.getElementById('documento');
    const inputCep = document.getElementById('cep');
    const inputEmail = document.getElementById('email');
    const tabela = document.getElementById('tabelaPessoas');
    const modal = document.getElementById('modalPesquisa');
   
    // ================= VALIDAÇÕES =================
   
    function validarEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
    }
   
    function validarCPF(cpf) {
        if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
        let soma = 0, resto;
        for (let i = 1; i <= 9; i++) soma += parseInt(cpf.substring(i-1, i)) * (11 - i);
        resto = (soma * 10) % 11;
        if (resto >= 10) resto = 0;
        if (resto !== parseInt(cpf.substring(9, 10))) return false;
   
        soma = 0;
        for (let i = 1; i <= 10; i++) soma += parseInt(cpf.substring(i-1, i)) * (12 - i);
        resto = (soma * 10) % 11;
        if (resto >= 10) resto = 0;
        return resto === parseInt(cpf.substring(10, 11));
    }
   
    function validarCNPJ(cnpj) {
        if (cnpj.length !== 14 || /^(\d)\1{13}$/.test(cnpj)) return false;
   
        let tamanho = 12;
        let numeros = cnpj.substring(0, tamanho);
        let digitos = cnpj.substring(tamanho);
   
        let soma = 0, pos = 5;
        for (let i = 0; i < 12; i++) {
            soma += numeros[i] * pos--;
            if (pos < 2) pos = 9;
        }
        let resultado = soma % 11 < 2 ? 0 : 11 - soma % 11;
        if (resultado != digitos[0]) return false;
   
        tamanho = 13;
        numeros = cnpj.substring(0, tamanho);
        soma = 0;
        pos = 6;
   
        for (let i = 0; i < 13; i++) {
            soma += numeros[i] * pos--;
            if (pos < 2) pos = 9;
        }
   
        resultado = soma % 11 < 2 ? 0 : 11 - soma % 11;
        return resultado == digitos[1];
    }
   
    function validarDocumento(doc) {
        if (doc.length === 11) return validarCPF(doc);
        if (doc.length === 14) return validarCNPJ(doc);
        return false;
    }
   
    // ================= MÁSCARAS =================
   
    inputDocumento.addEventListener('input', e => {
        let v = e.target.value.replace(/\D/g, "");
   
        if (v.length <= 11) {
            v = v.replace(/(\d{3})(\d)/, "$1.$2")
                 .replace(/(\d{3})(\d)/, "$1.$2")
                 .replace(/(\d{3})(\d{1,2})$/, "$1-$2");
        } else {
            v = v.replace(/^(\d{2})(\d)/, "$1.$2")
                 .replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3")
                 .replace(/\.(\d{3})(\d)/, ".$1/$2")
                 .replace(/(\d{4})(\d)/, "$1-$2");
        }
   
        e.target.value = v;
    });
   
    inputCep.addEventListener('input', async e => {
        let v = e.target.value.replace(/\D/g, "");
        v = v.replace(/(\d{5})(\d)/, "$1-$2");
        e.target.value = v;
   
        const cep = v.replace(/\D/g, "");
        if (cep.length === 8) {
            try {
                const res = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await res.json();
   
                if (!data.erro) {
                    document.getElementById('endereco').value = data.logradouro || '';
                    document.getElementById('bairro').value = data.bairro || '';
                    document.getElementById('cidade').value = data.localidade || '';
                    document.getElementById('estado').value = data.uf || '';
                }
            } catch (err) {
                console.log(err);
            }
        }
    });
   
    // ================= SUBMIT =================
   
    form.addEventListener('submit', async e => {
        e.preventDefault();
   
        const docLimpo = inputDocumento.value.replace(/\D/g, "");
   
        if (!validarEmail(inputEmail.value)) {
            alert("E-mail inválido");
            return;
        }
   
        if (!validarDocumento(docLimpo)) {
            alert("Documento inválido");
            return;
        }
   
        const payload = {
    nome_razao_social: document.getElementById('nome_razao_social').value,
    nome_social_fantasia: document.getElementById('nome_social_fantasia').value || null,

    documento: docLimpo,
    tipo: docLimpo.length > 11 ? "CNPJ" : "CPF",

    cep: inputCep.value.replace(/\D/g, "") || null,
    endereco: document.getElementById('endereco').value || null,
    numero: document.getElementById('numero').value || null,

    bairro: document.getElementById('bairro').value || null,
    cidade: document.getElementById('cidade').value || null,
    estado: document.getElementById('estado').value || null,

    pais: "Brasil",

    email: inputEmail.value || null
};
        try {
            const url = pessoaEditandoId 
                ? `${API_URL}/${pessoaEditandoId}` 
                : API_URL;

            const metodo = pessoaEditandoId ? "PUT" : "POST";

            const res = await fetch(url, {
                method: metodo,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
   
            if (res.ok) {
                alert("Salvo com sucesso");
                limparFormulario();
            } else {
                alert("Erro ao salvar");
            }
        } catch (err) {
            alert("Erro de conexão");
        }
    });
    
   
    // ================= LISTAR =================
   
    async function carregarPessoas() {
        const res = await fetch(API_URL);
        const data = await res.json();
   
        tabela.innerHTML = "";
   
        data.forEach(p => {
            tabela.innerHTML += `
                <tr>
                    <td>${p.nome_razao_social}</td>
                    <td>${p.documento}</td>
                    <td>
                        <button onclick="editarPessoa(${p.id})">Editar</button>
                        <button onclick="deletarPessoa(${p.id})">Excluir</button>
                    </td>
                </tr>
            `;
        });
    }
   
    // ================= EDITAR =================
    async function editarPessoa(id) {
        const res = await fetch(API_URL);
        const data = await res.json();

        const p = data.find(x => x.id === id);
        if (!p) return;

        pessoaEditandoId = id; // 👈 guarda ID

        document.getElementById('nome_razao_social').value = p.nome_razao_social || '';
        document.getElementById('documento').value = p.documento || '';
        document.getElementById('email').value = p.email || '';
        document.getElementById('cep').value = p.cep || '';
        document.getElementById('endereco').value = p.endereco || '';
        document.getElementById('numero').value = p.numero || '';
        document.getElementById('bairro').value = p.bairro || '';
        document.getElementById('cidade').value = p.cidade || '';
        document.getElementById('estado').value = p.estado || '';

        $('.ui.modal').modal('hide');
    }
   
    // ================= DELETE =================
   
    async function deletarPessoa(id) {
        if (!confirm("Excluir?")) return;
   
        await fetch(`${API_URL}/${id}`, { method: "DELETE" });
        carregarPessoas();
    }
   
    // ================= UI =================
   
    function limparFormulario() {
        form.reset();
    }
   
    function abrirModal() {
        $('.ui.modal').modal('show');
        carregarPessoas();
    }
   
    function fecharModal() {
        $('.ui.modal').modal('hide');
    }
    </script>

</body>
</html>
