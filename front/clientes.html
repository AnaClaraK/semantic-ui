<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Agendamentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Cadastrar Agendamento</h2>
        
        <form id="formCliente">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" required>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone / WhatsApp</label>
                <input type="tel" id="telefone" required>
            </div>

            <div class="form-group">
                <label for="horario">Horário do Agendamento</label>
                <input type="datetime-local" id="horario" required>
            </div>

            <div class="form-group">
                <label for="servicofeito">Serviço a ser Feito</label>
                <input type="text" id="servicofeito" placeholder="Ex: Corte, Tintura..." required>
            </div>

            <div class="form-group">
                <label for="preco">Preço (R$)</label>
                <input type="number" step="0.01" id="preco" placeholder="0.00" required>
            </div>

            <button type="submit">Cadastrar Agendamento</button>
        </form>

        <div id="mensagemStatus" class="message"></div>
    </div>

    <script>
        const form = document.getElementById('formCliente');
        const mensagemStatus = document.getElementById('mensagemStatus');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const nome = document.getElementById('nome').value;
            const telefone = document.getElementById('telefone').value;
            const horarioRaw = document.getElementById('horario').value; // Formato: YYYY-MM-DDTHH:MM
            const servicofeito = document.getElementById('servicofeito').value;
            const preco = document.getElementById('preco').value;

            // Formata a data do HTML (YYYY-MM-DDTHH:MM) para o padrão do MySQL (YYYY-MM-DD HH:MM:SS)
            const horario = horarioRaw.replace('T', ' ') + ':00';

            const dadosCliente = { nome, telefone, horario, servicofeito, preco };

            try {
                const response = await fetch('http://localhost:3000/inserircliente', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosCliente)
                });

                const resultado = await response.json();

                if (response.ok) {
                    const idGerado = resultado.id_cliente;
                    mensagemStatus.textContent = `✅ Agendamento cadastrado com sucesso! ID: ${idGerado}`;
                    mensagemStatus.style.color = '#04d361';
                    mensagemStatus.style.display = 'block';
                    form.reset();
                } else {
                    const erroServidor = resultado.error || 'Falha desconhecida no servidor.';
                    throw new Error(erroServidor);
                }
            } catch (error) {
                let mensagemAmigavel = error.message;

                if (error.message.includes("cannot be null")) {
                    mensagemAmigavel = "Existem campos obrigatórios exigidos pelo banco de dados que não foram preenchidos.";
                }

                mensagemStatus.textContent = `❌ Erro ao cadastrar: ${mensagemAmigavel}`;
                mensagemStatus.style.color = '#f75a68';
                mensagemStatus.style.display = 'block';
            }
        });
    </script>
</body>
</html>
