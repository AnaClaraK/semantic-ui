<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Cadastrar Cliente</h2>
        
        <form id="formCliente">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" required>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone / WhatsApp</label>
                <input type="tel" id="telefone" required>
            </div>

            <div class="form-group">
                <label for="cep">CEP</label>
                <input type="text" id="cep" placeholder="00000-000" required>
            </div>

            <button type="submit">Cadastrar Cliente</button>
        </form>

        <div id="mensagemStatus" class="message"></div>
    </div>

    <script>
        const form = document.getElementById('formCliente');
        const mensagemStatus = document.getElementById('mensagemStatus');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const nome = document.getElementById('nome').value;
            const telefone = document.getElementById('telefone').value;
            const cep = document.getElementById('cep').value;

            const dadosCliente = { nome, telefone, cep };

            try {
                const response = await fetch('http://localhost:3000/inserircliente', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosCliente)
                });

                const resultado = await response.json();

                if (response.ok) {
                    mensagemStatus.textContent = `✅ Cliente cadastrado com sucesso! ID: ${resultado.id}`;
                    mensagemStatus.style.color = '#04d361';
                    mensagemStatus.style.display = 'block';
                    form.reset();
                } else {
                    // Pega o erro detalhado enviado pelo objeto JSON do backend
                    const erroServidor = resultado.error || 'Falha desconhecida no servidor.';
                    throw new Error(erroServidor);
                }
            } catch (error) {
                // Trata as mensagens conhecidas de erro do banco de dados de forma amigável
                let mensagemAmigavel = error.message;

                if (error.message.includes("Unknown column 'cep'")) {
                    mensagemAmigavel = "A coluna 'cep' não existe na tabela de clientes do banco de dados.";
                } else if (error.message.includes("cannot be null")) {
                    mensagemAmigavel = "Existem campos obrigatórios exigidos pelo banco de dados que não foram preenchidos.";
                }

                mensagemStatus.textContent = `❌ Erro ao cadastrar: ${mensagemAmigavel}`;
                mensagemStatus.style.color = '#f75a68';
                mensagemStatus.style.display = 'block';
            }
        });
    </script>
</body>
</html>
