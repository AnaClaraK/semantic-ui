<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/fomantic-ui@2.9.3/dist/semantic.min.css">

  <title>Cadastro</title>

  <style>
    body {
      background: #f4f4f4;
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    .box {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 25px;
      text-align: center;
    }

    .ui.button {
      margin-top: 10px;
    }

    table {
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="box">

  <h2>Cadastro de Pessoa</h2>

  <form class="ui form" id="formPessoa">

    <div class="field">
      <label>Nome</label>
      <input type="text" id="nome_razao_social" required>
    </div>

    <div class="field">
      <label>CPF ou CNPJ</label>
      <input type="text" id="documento" required>
    </div>

    <div class="field">
      <label>E-mail</label>
      <input type="email" id="email">
    </div>

    <div class="two fields">
      <div class="field">
        <label>CEP</label>
        <input type="text" id="cep">
      </div>

      <div class="field">
        <label>Número</label>
        <input type="text" id="numero">
      </div>
    </div>

    <div class="field">
      <label>Endereço</label>
      <input type="text" id="endereco">
    </div>

    <div class="two fields">
      <div class="field">
        <label>Cidade</label>
        <input type="text" id="cidade">
      </div>

      <div class="field">
        <label>Estado</label>
        <input type="text" id="estado">
      </div>
    </div>

    <button class="ui blue button" type="submit">
      Salvar
    </button>

    <button class="ui black button" type="button" onclick="listarPessoa()">
      Listar
    </button>

  </form>

  <table class="ui celled table">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Documento</th>
        <th>Ações</th>
      </tr>
    </thead>

    <tbody id="tabelaPessoa"></tbody>
  </table>

</div>

<script>
  const API_URL = "http://localhost:3000/pessoa";
  let editandoId = null;

  const form = document.getElementById("formPessoa");
  const tabela = document.getElementById("tabelaPessoa");

  // ================= SALVAR =================

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const payload = {
      nome_razao_social: document.getElementById("nome_razao_social").value,
      documento: document.getElementById("documento").value,
      email: document.getElementById("email").value,
      cep: document.getElementById("cep").value,
      numero: document.getElementById("numero").value,
      endereco: document.getElementById("endereco").value,
      cidade: document.getElementById("cidade").value,
      estado: document.getElementById("estado").value
    };

    const metodo = editandoId ? "PUT" : "POST";

    const url = editandoId
      ? `${API_URL}/${editandoId}`
      : API_URL;

    const res = await fetch(url, {
      method: metodo,
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    if (res.ok) {
      alert("Salvo com sucesso!");
      form.reset();
      editandoId = null;
      listarPessoa();
    } else {
      alert("Erro ao salvar");
    }
  });

  // ================= LISTAR =================

  async function listarPessoa() {

    const res = await fetch(API_URL);
    const data = await res.json();

    tabela.innerHTML = "";

    data.forEach(pessoa => {

      tabela.innerHTML += `
        <tr>
          <td>${pessoa.nome_razao_social}</td>
          <td>${pessoa.documento}</td>

          <td>
            <button onclick="editarPessoa(${pessoa.id})">
              Editar
            </button>

            <button onclick="deletarPessoa(${pessoa.id})">
              Excluir
            </button>
          </td>
        </tr>
      `;
    });
  }

  // ================= EDITAR =================

  async function editarPessoa(id) {

    const res = await fetch(API_URL);
    const data = await res.json();

    const pessoa = data.find(p => p.id == id);

    editandoId = id;

    document.getElementById("nome_razao_social").value = pessoa.nome_razao_social;
    document.getElementById("documento").value = pessoa.documento;
    document.getElementById("email").value = pessoa.email;
    document.getElementById("cep").value = pessoa.cep;
    document.getElementById("numero").value = pessoa.numero;
    document.getElementById("endereco").value = pessoa.endereco;
    document.getElementById("cidade").value = pessoa.cidade;
    document.getElementById("estado").value = pessoa.estado;
  }

  // ================= EXCLUIR =================

  async function deletarPessoa(id) {

    if (!confirm("Deseja excluir?")) return;

    await fetch(`${API_URL}/${id}`, {
      method: "DELETE"
    });

    listarPessoa();
  }

</script>

</body>
</html>
