<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento Salão</title>
    <link rel="stylesheet" href="/front/style.css">
</head>
<body>
    <h2>Agendamento - Salão de Beleza</h2>
    <form id="formAgendamento">
        <div class="form-group">
            <label>Nome do Cliente</label>
            <input type="text" id="nome_cliente" required>
        </div>
        <div class="form-group">
            <label>Telefone</label>
            <input type="text" id="telefone" required>
        </div>
        <div class="form-group">
            <label>Serviço</label>
            <input type="text" id="servico" required>
        </div>
        <div class="form-group">
            <label>Profissional</label>
            <input type="text" id="profissional" required>
        </div>
        <div class="form-group">
            <label>Data</label>
            <input type="date" id="data_agendamento" required>
        </div>
        <div class="form-group">
            <label>Horário</label>
            <input type="time" id="horario" required>
        </div>
        <button type="submit" id="btnSalvar">
            Agendar Horário
        </button>
        <div class="mensagem" id="mensagem"></div>
    </form>
    <script>
        const form = document.getElementById("formAgendamento");
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const dados = {
                nome_cliente: document.getElementById("nome_cliente").value,
                telefone: document.getElementById("telefone").value,
                servico: document.getElementById("servico").value,
                profissional: document.getElementById("profissional").value,
                data_agendamento: document.getElementById("data_agendamento").value,
                horario: document.getElementById("horario").value
            };
            try {
                const resposta = await fetch("http://localhost:3000/agendamento", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(dados)
                });
                const resultado = await resposta.json();
                if (resposta.ok) {
                    document.getElementById("mensagem").innerHTML =
                        "Agendamento realizado com sucesso!";
                    form.reset();
                } else {
                    document.getElementById("mensagem").innerHTML =
                        resultado.erro;
                }
            } catch (erro) {
                document.getElementById("mensagem").innerHTML =
                    "Erro ao conectar com o servidor";
                console.log(erro);
            }
        });
    </script>
</body>
</html>
